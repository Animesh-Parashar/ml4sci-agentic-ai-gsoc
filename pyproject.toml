[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "deeplense-agentic-ai"
version = "0.1.0"
description = "Pydantic AI agentic workflow for DeepLenseSim gravitational lensing simulation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-ai>=0.0.20",
    "numpy>=1.21",
    "matplotlib>=3.5",
    "astropy>=5.0",
    "lenstronomy==1.9.2",
    "colossus>=1.3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
